name: "Feature Request"
description: "Suggest an idea or enhancement for Arbitrage Inception"
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Proposal
      description: Describe the proposed feature or improvement.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: DeFi & Architecture Rationale
      description: Why would this feature benefit users, bot operators, or the protocol?
